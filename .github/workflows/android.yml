name: Android Debug Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Gradle version check
        run: ./gradlew --version 2>&1 | tee gradle_version.log

      - name: Upload gradle version log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-version-log
          path: gradle_version.log
          retention-days: 7

      - name: Gradle dependencies check
        run: ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon 2>&1 | tee deps.log
        continue-on-error: true

      - name: Upload deps log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-log
          path: deps.log
          retention-days: 7

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7